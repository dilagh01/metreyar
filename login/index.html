<!-- ===== اضافه‌شده: اسکریپت لوکال-بای‌پَس ===== -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    // فرم لوکال: هر چیزی وارد شود، لاگین موفق می‌شود
    const form = document.getElementById("novin-local-login-form");
    form.addEventListener("submit", function (e) {
        e.preventDefault(); // جلوگیری از ارسال واقعی فرم به سرور

        // ست کردن مقدار لاگین عمومی
        localStorage.setItem("novin_logged_in", "true");

        // اگر می‌خواهیم همه صفحات بدون مراجعه به فرم قابل‌مشاهده باشند،
        // مقدار زیر را هم ست می‌کنیم (اختیاری)
        // localStorage.setItem("novin_bypass_all_pages", "true");

        // ریدایرکت به صفحه لیست (یا هر صفحه‌ای که می‌خواهید)
        window.location.href = "list.html";
    });

    // دکمهٔ فعال‌سازی bypass (برای توسعه لوکال)
    const enableBtn = document.getElementById("enable-bypass-btn");
    enableBtn.addEventListener("click", function () {
        localStorage.setItem("novin_bypass_all_pages", "true");
        localStorage.setItem("novin_logged_in", "true");
        toastr.success("قابلیت مشاهدهٔ همه صفحات فعال شد. اکنون می‌توانید صفحات را مستقیم باز کنید.");
    });

    // دکمهٔ غیرفعال‌سازی bypass
    const disableBtn = document.getElementById("disable-bypass-btn");
    disableBtn.addEventListener("click", function () {
        localStorage.removeItem("novin_bypass_all_pages");
        localStorage.removeItem("novin_logged_in");
        toastr.info("bypass غیرفعال شد. برای دسترسی باید مجدداً لاگین کنید.");
    });

    // در صورتی که خواستید فوراً bypass را برای این بازدیدگر فعال کنید
    // (مثلاً حالت فایل:// یا لوکال هاست)
    const hostname = location.hostname;
    if (hostname === "localhost" || hostname === "127.0.0.1" || location.protocol === "file:") {
        // می‌توانید این را فعال کنید یا غیرفعال نگه دارید تا کاربر از دکمه فعال کند
        // localStorage.setItem("novin_bypass_all_pages", "true");
        // localStorage.setItem("novin_logged_in", "true");
        console.info("Running on local host/file protocol — bypass available via دکمه فعال‌سازی.");
    }
});
</script>

  if (localStorage.getItem('novin_bypass_all_pages') === 'true') {

  } else {

      if (!localStorage.getItem('novin_logged_in')) {
          window.location.href = 'login.html';
      }
  }
</script>
